name: Claude Code Review

on:
  pull_request:
    types: [labeled]

jobs:
  skip-notice:
    if: |
      github.event.label.name == 'size/m'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment that Claude review was skipped
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `> [!WARNING]\n> **Mentioning Claude is not recommended due to PR size is: ** — \`${{ github.event.label.name }}\`.\n>  Please request a manual review instead.`
            })
