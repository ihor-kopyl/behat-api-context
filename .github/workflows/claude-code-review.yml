name: Claude Code Review

on:
  pull_request:
    types: [labeled]

jobs:
  skip-notice:
    if: |
      github.event.label.name == 'L' ||
      github.event.label.name == 'XL'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment that Claude review was skipped
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `> [!WARNING]\n> **Claude review skipped** — this PR is size \`${{ github.event.label.name }}\`. Please request a manual review.`
            })

  claude-review:
    if: |
      github.event.label.name == 'XS' ||
      github.event.label.name == 'S' ||
      github.event.label.name == 'M'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

