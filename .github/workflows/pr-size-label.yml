name: PR Size Label

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Label PR size
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: 10
          s_max_size: 50
          m_max_size: 150
          l_max_size: 500
          fail_if_xl: false

  skip-notice:
    needs: label
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Check PR labels
        id: labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            core.setOutput("large", labels.includes("size/l"));

      - name: Comment that Claude review was skipped
        if: steps.labels.outputs.large == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `> [!WARNING]\n> 🙅 Mentioning **Claude** is not recommended due to PR size is:  \`${{ github.event.label.name }}\`.\n>  Please request a manual review instead.`
            })

