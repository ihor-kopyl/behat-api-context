name: PR Size Label + Claude Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  label:
    name: Label PR size
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Label PR size
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: ${{ vars.PR_SIZE_XS_MAX }}
          s_max_size: ${{ vars.PR_SIZE_S_MAX }}
          m_max_size: ${{ vars.PR_SIZE_M_MAX }}
          l_max_size: ${{ vars.PR_SIZE_L_MAX }}
          fail_if_xl: false

  skip-notice:
    name: Skip Claude for large PR
    needs: label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Check PR size label
        id: size
        run: |
          labels=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json labels \
            --jq '.labels[].name')

          echo "Labels:"
          echo "$labels"

          if echo "$labels" | grep -E "size/l|size/xl"; then
            echo "large=true" >> $GITHUB_OUTPUT
          else
            echo "large=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upsert claude notice
        uses: actions/github-script@v7
        with:
          script: |
            const large = '${{ steps.size.outputs.large }}' === 'true';
            const marker = '<!-- claude-notice -->';
            const body = large
              ? `${marker}\n> [!WARNING]\n> 🙅 Mentioning **Claude** is not recommended due to PR size is to big.\n>  Please request a manual review instead.`
              : `${marker}\n> [!TIP]\n> 👌 Please mention **@.claude** to ask AI codereview.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
