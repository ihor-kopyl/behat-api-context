name: Claude PR Review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'ai-review'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: ai-review
          prompt: |
            Review this pull request and provide detailed feedback.

            Focus on:
            - Code quality and best practices
            - PHP/Behat-specific patterns and conventions
            - Potential bugs or edge cases
            - Test coverage and test quality
            - Security concerns
            - Performance issues

            Post your review as comments on the PR, using inline comments on specific lines where relevant.
          claude_args: --model claude-opus-4-6
